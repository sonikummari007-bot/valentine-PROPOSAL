<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>YAY 💘</title>
  <style>
    :root{
      --card:#ffffffdb;
      --text:#141414;
      --shadow: 0 18px 80px rgba(0,0,0,.18);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; overflow:hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      display:flex; align-items:center; justify-content:center;
      padding:22px;
      position:relative;
      background: radial-gradient(900px 650px at 20% 25%, #fff1f2, transparent 60%),
                  radial-gradient(900px 650px at 80% 20%, #e9d5ff, transparent 60%),
                  radial-gradient(900px 650px at 55% 90%, #dbeafe, transparent 60%),
                  linear-gradient(180deg, #fff, #ffe4ec);
    }

    /* your photo as soft background */
    .bgPhoto{
      position:fixed; inset:0;
      background-image: url("hands.jpg");
      background-size: cover;
      background-position: center;
      filter: blur(12px) brightness(1.08) saturate(1.1);
      opacity:.22;
      transform: scale(1.08);
      z-index:-3;
    }

    canvas{ position:fixed; inset:0; z-index:-2; }

    .sparkle{
      position:fixed;
      width:6px; height:6px;
      border-radius:999px;
      background: rgba(255,255,255,.95);
      box-shadow: 0 0 18px rgba(255,255,255,.95);
      opacity:.9;
      animation: twinkle 1.8s infinite ease-in-out;
      pointer-events:none;
      z-index:-1;
    }
    @keyframes twinkle{
      0%,100%{ transform: scale(.8); opacity:.6; }
      50%{ transform: scale(1.4); opacity:1; }
    }

    .heart{
      position:fixed; bottom:-40px;
      font-size:18px; opacity:.95;
      animation: floatUp linear forwards;
      pointer-events:none;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.10));
    }
    @keyframes floatUp{
      to{ transform: translateY(-120vh) translateX(var(--drift)) rotate(25deg); opacity:1; }
    }

    .balloon{
      position:fixed; bottom:-120px;
      width:44px; height:58px; border-radius:999px;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.75), transparent 35%),
                  linear-gradient(180deg, rgba(255,255,255,.18), rgba(0,0,0,.08));
      opacity:.96;
      filter: drop-shadow(0 12px 18px rgba(0,0,0,.12));
      animation: balloonUp linear forwards;
      pointer-events:none;
    }
    .balloon:after{
      content:"";
      position:absolute; left:50%; top:56px;
      width:2px; height:70px;
      background: rgba(0,0,0,.15);
      transform: translateX(-50%);
    }
    @keyframes balloonUp{
      to{ transform: translateY(-130vh) translateX(var(--drift)) rotate(var(--rot)); opacity:1; }
    }

    .confetti{
      position:fixed;
      width:10px; height:14px;
      top:-20px; left:0;
      opacity:.95;
      transform: rotate(0deg);
      animation: fall 2.2s linear forwards;
      pointer-events:none;
      z-index: 9998;
    }
    @keyframes fall{ to{ transform: translateY(110vh) rotate(880deg); opacity:1; } }

    .card{
      width:min(920px, 96vw);
      background:var(--card);
      border:1px solid #ffffffb0;
      backdrop-filter: blur(10px);
      border-radius:34px;
      padding:36px 22px 28px;
      text-align:center;
      box-shadow: var(--shadow);
      position:relative;
      overflow:hidden;
    }
    .shine{
      position:absolute; inset:-90px -160px auto auto;
      width:340px; height:340px;
      background: radial-gradient(circle, rgba(255,255,255,.9), transparent 60%);
      transform: rotate(25deg);
      opacity:.45;
      pointer-events:none;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 14px;
      border-radius:999px;
      background:#ffffffef;
      border:1px solid #ffffff;
      font-weight:950;
      color:#111;
      box-shadow: 0 10px 24px rgba(0,0,0,.10);
      margin-bottom:14px;
    }
    h1{
      margin: 0 0 10px;
      font-size: clamp(32px, 4.4vw, 60px);
      color:var(--text);
      letter-spacing:.2px;
      text-shadow: 0 10px 30px rgba(0,0,0,.07);
      animation: pop 900ms ease both;
    }
    @keyframes pop{
      from{ transform: translateY(10px) scale(.96); opacity:0; }
      to{ transform: translateY(0) scale(1); opacity:1; }
    }
    .big{
      margin: 10px auto 0;
      width:min(780px, 95%);
      font-size: clamp(16px, 2.5vw, 26px);
      font-weight:950;
      color:#1a1a1a;
      line-height:1.45;
    }
    .pulse{
      font-size:64px;
      margin-bottom:6px;
      animation: pulse 1.15s infinite ease-in-out;
      filter: drop-shadow(0 14px 26px rgba(0,0,0,.10));
    }
    @keyframes pulse{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.14)} }

    .sub{
      margin-top:12px;
      font-size: 14px;
      opacity:.85;
      font-weight:900;
    }

    .musicBtn{
      position:fixed;
      bottom:16px; left:50%;
      transform: translateX(-50%);
      padding:12px 16px;
      border-radius:18px;
      border:none;
      font-weight:950;
      background:#111;
      color:#fff;
      cursor:pointer;
      box-shadow: 0 14px 28px rgba(0,0,0,.15);
      z-index:9999;
    }

    .moreBtn{
      margin-top:18px;
      display:inline-flex;
      gap:10px;
      align-items:center;
      justify-content:center;
      padding:14px 18px;
      border-radius:18px;
      background:#111;
      color:#fff;
      font-weight:950;
      border:none;
      cursor:pointer;
      box-shadow: 0 14px 28px rgba(0,0,0,.15);
      transition: transform .12s ease, filter .12s ease;
    }
    .moreBtn:hover{ filter: brightness(1.05); transform: translateY(-1px); }
    .moreBtn:active{ transform: scale(.98); }
  </style>
</head>
<body>
  <div class="bgPhoto"></div>
  <canvas id="fx"></canvas>

  <!-- upload stream.mp3 + hands.jpg -->
  <audio id="bg" src="stream.mp3" preload="auto" loop></audio>
  <button id="playBtn" class="musicBtn">Play Music 🎵</button>

  <div class="card">
    <div class="shine"></div>
    <div class="badge">💖 YES CONFIRMED 💖</div>
    <div class="pulse">🎀</div>
    <h1>Congratulations!</h1>
    <div class="big">
      You are <b>Pranay’s</b> Valentine for his complete life 🥰💍
    </div>
    <div class="sub">P.S. Ab toh lifetime booking ho gayi 😌💘</div>

    <button class="moreBtn" id="more">More celebration 🎉</button>
  </div>

  <script>
    // sparkles
    for(let i=0;i<30;i++){
      const s = document.createElement("div");
      s.className = "sparkle";
      s.style.left = (Math.random()*100) + "vw";
      s.style.top  = (Math.random()*100) + "vh";
      s.style.animationDelay = (Math.random()*1.8) + "s";
      s.style.opacity = (0.5 + Math.random()*0.5);
      document.body.appendChild(s);
    }

    // hearts + balloons
    setInterval(()=>{
      const h = document.createElement("div");
      h.className = "heart";
      h.textContent = Math.random() < .33 ? "💖" : (Math.random() < .5 ? "💘" : "💞");
      h.style.left = (Math.random()*100) + "vw";
      h.style.setProperty("--drift", (Math.random()*160 - 80) + "px");
      h.style.animationDuration = (3 + Math.random()*3.5) + "s";
      h.style.fontSize = (14 + Math.random()*22) + "px";
      document.body.appendChild(h);
      setTimeout(()=>h.remove(), 7800);
    }, 170);

    setInterval(()=>{
      const b = document.createElement("div");
      b.className = "balloon";
      b.style.left = (Math.random()*100) + "vw";
      b.style.setProperty("--drift", (Math.random()*200 - 100) + "px");
      b.style.setProperty("--rot", (Math.random()*18 - 9) + "deg");
      b.style.animationDuration = (6 + Math.random()*5) + "s";
      b.style.backgroundColor = `hsl(${Math.random()*360}, 90%, 72%)`;
      document.body.appendChild(b);
      setTimeout(()=>b.remove(), 12000);
    }, 560);

    // confetti
    function confettiBurst(count){
      for(let i=0;i<count;i++){
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = (Math.random()*100) + "vw";
        c.style.background = `hsl(${Math.random()*360}, 90%, 60%)`;
        c.style.animationDuration = (1.6 + Math.random()*1.6) + "s";
        c.style.width = (6 + Math.random()*10) + "px";
        c.style.height = (8 + Math.random()*16) + "px";
        document.body.appendChild(c);
        setTimeout(()=>c.remove(), 3600);
      }
    }
    confettiBurst(260);

    // fireworks
    const canvas = document.getElementById("fx");
    const ctx = canvas.getContext("2d");
    let W,H;
    function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
    window.addEventListener("resize", resize); resize();

    const bursts = [];
    function addBurst(x,y){
      const n = 80 + Math.floor(Math.random()*50);
      const hue = Math.random()*360;
      const parts = [];
      for(let i=0;i<n;i++){
        const a = (Math.PI*2)*(i/n);
        const sp = 2 + Math.random()*4.4;
        parts.push({
          x,y,
          vx: Math.cos(a)*sp*(0.7+Math.random()*0.6),
          vy: Math.sin(a)*sp*(0.7+Math.random()*0.6),
          life: 75 + Math.random()*35,
          hue
        });
      }
      bursts.push(parts);
    }

    let t=0;
    function loop(){
      ctx.fillStyle = "rgba(255,255,255,0.10)";
      ctx.fillRect(0,0,W,H);

      for(let b=bursts.length-1;b>=0;b--){
        const parts = bursts[b];
        for(let i=parts.length-1;i>=0;i--){
          const p = parts[i];
          p.x += p.vx; p.y += p.vy;
          p.vy += 0.03;
          p.vx *= 0.992; p.vy *= 0.992;
          p.life -= 1;

          ctx.beginPath();
          ctx.fillStyle = `hsla(${p.hue}, 95%, 62%, ${Math.max(0,p.life/95)})`;
          ctx.arc(p.x, p.y, 2, 0, Math.PI*2);
          ctx.fill();

          if(p.life <= 0) parts.splice(i,1);
        }
        if(parts.length === 0) bursts.splice(b,1);
      }

      t++;
      if(t % 24 === 0){
        addBurst(Math.random()*W, (0.15+Math.random()*0.45)*H);
      }
      requestAnimationFrame(loop);
    }
    for(let i=0;i<4;i++) addBurst(Math.random()*W, (0.18+Math.random()*0.35)*H);
    loop();

    document.getElementById("more").addEventListener("click", ()=>{
      confettiBurst(300);
      for(let i=0;i<6;i++){
        addBurst(Math.random()*W, (0.18+Math.random()*0.45)*H);
      }
    });

    // music (autoplay may be blocked; button always works)
    const bg = document.getElementById("bg");
    const playBtn = document.getElementById("playBtn");

    async function tryPlay(){
      try{
        await bg.play();
        playBtn.style.display = "none";
      }catch(e){}
    }
    playBtn.addEventListener("click", tryPlay);
    setTimeout(tryPlay, 200);
  </script>
</body>
</html>
