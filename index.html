<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Valentine 💖</title>
  <style>
    :root{
      --pink:#ff4d6d; --peach:#ffd6e0; --lilac:#e9d5ff;
      --card:#ffffffcc; --text:#151515;
      --yes1:#34d399; --yes2:#16a34a;
      --no1:#ff98ab;  --no2:#fb7185;
      --shadow: 0 18px 70px rgba(0,0,0,.18);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; overflow:hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(1100px 700px at 15% 15%, #fff, transparent 55%),
        radial-gradient(900px 650px at 85% 20%, #ffe4ec, transparent 58%),
        radial-gradient(1200px 700px at 70% 90%, #e9d5ff, transparent 55%),
        radial-gradient(circle at top, var(--peach), var(--pink));
      display:flex; align-items:center; justify-content:center;
      padding:22px;
    }

    .blob{
      position:fixed; width:360px; height:360px; border-radius:999px;
      filter: blur(28px); opacity:.35; pointer-events:none;
      animation: blob 10s ease-in-out infinite;
    }
    .b1{ left:-120px; top:-120px; background:#fff; }
    .b2{ right:-140px; top:10%; background:#ffd1dc; animation-delay:-3s;}
    .b3{ left:10%; bottom:-150px; background:#e9d5ff; animation-delay:-6s;}
    @keyframes blob{ 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(40px,30px) scale(1.12)} }

    /* hearts */
    .heart{
      position:fixed; bottom:-40px;
      font-size:18px; opacity:.9;
      animation: floatUp linear forwards;
      pointer-events:none;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.12));
    }
    @keyframes floatUp{
      to{ transform: translateY(-120vh) translateX(var(--drift)) rotate(25deg); opacity:1; }
    }

    /* balloons */
    .balloon{
      position:fixed; bottom:-120px;
      width:44px; height:58px; border-radius:999px;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.75), transparent 35%),
                  linear-gradient(180deg, rgba(255,255,255,.18), rgba(0,0,0,.08));
      opacity:.96;
      filter: drop-shadow(0 12px 18px rgba(0,0,0,.12));
      animation: balloonUp linear forwards;
      pointer-events:none;
    }
    .balloon:after{
      content:"";
      position:absolute; left:50%; top:56px;
      width:2px; height:70px;
      background: rgba(0,0,0,.15);
      transform: translateX(-50%);
    }
    @keyframes balloonUp{
      to{ transform: translateY(-130vh) translateX(var(--drift)) rotate(var(--rot)); opacity:1; }
    }

    /* card */
    .card{
      width:min(900px, 96vw);
      background:var(--card);
      border:1px solid #ffffff80;
      backdrop-filter: blur(10px);
      border-radius:32px;
      padding:28px 22px 22px;
      box-shadow: var(--shadow);
      text-align:center;
      position:relative;
      overflow:hidden;
    }
    .shine{
      position:absolute; inset:-80px -140px auto auto;
      width:320px; height:320px;
      background: radial-gradient(circle, rgba(255,255,255,.85), transparent 60%);
      transform: rotate(25deg);
      opacity:.45;
      pointer-events:none;
    }
    .top{
      display:flex; gap:16px; align-items:center; justify-content:center;
      flex-wrap:wrap; margin-bottom:12px;
    }
    .avatar{
      width:96px; height:96px; border-radius:26px;
      background: linear-gradient(135deg, #fff, #ffe4ec, #e9d5ff);
      border:2px solid #ffffffb0;
      box-shadow: 0 16px 40px rgba(0,0,0,.15);
      display:flex; align-items:center; justify-content:center;
      font-size:42px;
    }
    h1{
      margin:0;
      font-size: clamp(26px, 4.2vw, 48px);
      color:var(--text);
      letter-spacing:.2px;
    }
    .subtitle{
      margin:6px 0 0;
      font-size: clamp(14px, 2vw, 18px);
      color:#222;
      opacity:.9;
      font-weight:700;
    }

    /* photo memory block */
    .memory{
      width:min(760px, 96%);
      margin: 10px auto 6px;
      border-radius:24px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.9);
      box-shadow: 0 16px 50px rgba(0,0,0,.16);
      position:relative;
    }
    .memory img{
      width:100%; height:220px;
      object-fit:cover;
      display:block;
      filter: saturate(1.08) contrast(1.02);
      transform: scale(1.02);
    }
    .memory .cap{
      position:absolute; inset:auto 0 0 0;
      padding:10px 12px;
      background: linear-gradient(180deg, transparent, rgba(0,0,0,.45));
      color:#fff;
      font-weight:900;
      letter-spacing:.2px;
      text-align:left;
      font-size: 14px;
    }

    /* typing */
    .typing{
      margin: 14px auto 10px;
      width:min(720px, 95%);
      font-weight:950;
      font-size: clamp(16px, 2.4vw, 20px);
      color:#111;
      min-height: 30px;
    }
    .cursor{
      display:inline-block; width:10px; height:18px;
      background:#111; border-radius:3px;
      vertical-align:-2px;
      animation: blink 1s infinite;
      margin-left:6px;
    }
    @keyframes blink{ 50%{opacity:0} }

    /* buttons */
    .arena{
      margin-top:16px;
      position:relative;
      min-height:86px;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      gap:14px;
      flex-wrap:wrap;
    }
    button{
      border:none;
      padding:14px 24px;
      font-size:18px;
      font-weight:950;
      border-radius:16px;
      cursor:pointer;
      box-shadow: 0 12px 28px rgba(0,0,0,.14);
      transition: transform .12s ease, filter .12s ease;
      user-select:none;
    }
    button:active{ transform: scale(.98); }
    #yes{
      background: linear-gradient(180deg, var(--yes1), var(--yes2));
      color:white;
    }
    #yes:hover{ filter: brightness(1.05); transform: translateY(-1px); }

    #no{
      background: linear-gradient(180deg, var(--no1), var(--no2));
      color:white;
      position:absolute;
      left:55%;
      top:0;
      transform: translateX(-50%);
    }

    .bubble{
      margin: 14px auto 0;
      width:min(760px, 95%);
      background:#ffffffd8;
      border:1px dashed #ffffff;
      border-radius:18px;
      padding:12px 14px;
      font-weight:950;
      color:#111;
      min-height: 46px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .tiny{ margin-top:10px; font-size:12px; opacity:.7; font-weight:800; }
    .footerHearts{ margin-top:14px; font-size:22px; opacity:.9; letter-spacing:2px; }

    /* confetti */
    .confetti{
      position:fixed; width:10px; height:14px;
      top:-20px; left:0;
      opacity:.95;
      transform: rotate(0deg);
      animation: fall 2.1s linear forwards;
      pointer-events:none;
      z-index: 9998;
    }
    @keyframes fall{ to{ transform: translateY(110vh) rotate(880deg); opacity:1; } }

    /* YES overlay */
    .yesOverlay{
      position:fixed; inset:0;
      background: rgba(0,0,0,.28);
      backdrop-filter: blur(8px);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:9999;
      padding:18px;
    }
    .yesCard{
      width:min(520px, 94vw);
      background:#ffffffef;
      border-radius:26px;
      box-shadow: 0 20px 70px rgba(0,0,0,.25);
      padding:18px 16px;
      text-align:center;
      border:1px solid #fff;
    }
    .yesCard .big{ font-size:22px; font-weight:950; margin:6px 0 2px; }
    .yesCard .small{ opacity:.85; font-weight:900; font-size:13px; }
    .pulseHeart{
      font-size:52px;
      animation: pulse 1.1s infinite ease-in-out;
      filter: drop-shadow(0 12px 24px rgba(0,0,0,.12));
    }
    @keyframes pulse{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.14)} }
  </style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

  <!-- upload stream.mp3 + hands.jpg to repo root -->
  <audio id="yesMusic" src="stream.mp3" preload="auto"></audio>

  <div class="yesOverlay" id="yesOverlay">
    <div class="yesCard">
      <div class="pulseHeart">💖</div>
      <div class="big" id="overlayText">YAYYYY!! 🥹💘</div>
      <div class="small">One sec… I’m saving this moment forever ✨</div>
    </div>
  </div>

  <div class="card">
    <div class="shine"></div>

    <div class="top">
      <div class="avatar">💝</div>
      <div>
        <h1>Dear <span id="girlName">Nisuuu</span> 💗</h1>
        <div class="subtitle">I’m asking with my full heart… 🥹</div>
      </div>
    </div>

    <!-- YOUR HAND-HOLDING PHOTO -->
    <div class="memory">
      <img src="hands.jpg" alt="Our moment">
      <div class="cap">My favorite place is right here… with you 🤍</div>
    </div>

    <div class="typing" id="typing"></div>

    <div class="arena" id="arena">
      <button id="yes">YES ✅</button>
      <button id="no">NO ❌</button>
    </div>

    <div class="bubble" id="bubble">Try pressing “NO” 😈</div>
    <div class="tiny">Tip: “YES” unlocks cute celebrations 🎉</div>
    <div class="footerHearts">💗 💖 💘 💞</div>
  </div>

  <script>
    // confirmed spellings ✅
    const GIRL_NAME = "Nisuuu";
    const YES_REDIRECT = "yes.html";

    document.getElementById("girlName").textContent = GIRL_NAME;

    // typing
    const typingEl = document.getElementById("typing");
    const lines = [
      `Hey ${GIRL_NAME}…`,
      "You’re my comfort, my calm, my happiest chaos ✨",
      "You made my ordinary days feel special 🥹",
      "So… will you be my Valentine? 💘"
    ];
    const cursor = document.createElement("span");
    cursor.className = "cursor";
    const sleep = (ms)=> new Promise(r=>setTimeout(r, ms));
    async function typeLine(text){
      typingEl.textContent = "";
      typingEl.appendChild(document.createTextNode(""));
      typingEl.appendChild(cursor);
      for(let i=0;i<text.length;i++){
        typingEl.firstChild.textContent += text[i];
        await sleep(26);
      }
    }
    (async ()=>{
      for(const l of lines){
        await typeLine(l);
        await sleep(650);
      }
    })();

    function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

    // hearts
    setInterval(()=>{
      const h = document.createElement("div");
      h.className = "heart";
      h.textContent = Math.random() < .33 ? "💖" : (Math.random() < .5 ? "💘" : "💗");
      h.style.left = (Math.random()*100) + "vw";
      h.style.setProperty("--drift", (Math.random()*140 - 70) + "px");
      h.style.animationDuration = (3 + Math.random()*3) + "s";
      h.style.fontSize = (14 + Math.random()*20) + "px";
      document.body.appendChild(h);
      setTimeout(()=>h.remove(), 7000);
    }, 200);

    // balloons
    setInterval(()=>{
      const b = document.createElement("div");
      b.className = "balloon";
      b.style.left = (Math.random()*100) + "vw";
      b.style.setProperty("--drift", (Math.random()*180 - 90) + "px");
      b.style.setProperty("--rot", (Math.random()*18 - 9) + "deg");
      b.style.animationDuration = (5.5 + Math.random()*4.5) + "s";
      b.style.backgroundColor = `hsl(${Math.random()*360}, 90%, 72%)`;
      document.body.appendChild(b);
      setTimeout(()=>b.remove(), 11000);
    }, 650);

    // NO prank
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const arena = document.getElementById("arena");
    const bubble = document.getElementById("bubble");

    const noLines = [
      "PLS MANN JAO MERI JAAN 🥺💗",
      "Meri billi 😼💞",
      "meri wifeyy mann jao 😭💘",
      "NO button is shy 🙈",
      "Arey yaar… YES bol do na 🥹",
      "Nope. Not allowed 😌",
      "Error 404: NO not found 😂",
      "Ek baar YES toh bol do… bas 🫶",
      "You’re my favorite person 😭💖",
      "NO ran away because it loves YES 😈",
      "Okay listen… you’re my forever 💍💘",
      "Say YES and I’ll do happy dance 💃🕺",
      "Nisuuu pls… cute sa YES 🥺✨",
      "I’ll give you chocolates if you press YES 🍫😳",
      "You’re my safe place 🤍",
      "If you press YES… I’ll smile for 7 days straight 😭"
    ];

    function moveNo(){
      const rect = arena.getBoundingClientRect();
      const bw = noBtn.offsetWidth;
      const bh = noBtn.offsetHeight;
      const pad = 8;

      const x = rand(pad, Math.max(pad, rect.width - bw - pad));
      const y = rand(0, Math.max(0, rect.height - bh - pad));

      noBtn.style.left = x + "px";
      noBtn.style.top  = y + "px";

      bubble.textContent = noLines[rand(0, noLines.length-1)];
      noBtn.animate([
        {transform:"translateX(-50%) rotate(0deg)"},
        {transform:"translateX(-50%) rotate(-8deg)"},
        {transform:"translateX(-50%) rotate(8deg)"},
        {transform:"translateX(-50%) rotate(0deg)"}
      ], {duration: 320});
    }

    ["mouseenter","mouseover","pointerdown","touchstart","click"].forEach(evt=>{
      noBtn.addEventListener(evt, (e)=>{
        e.preventDefault();
        moveNo();
      }, {passive:false});
    });

    // confetti
    function confettiBurst(count){
      for(let i=0;i<count;i++){
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = (Math.random()*100) + "vw";
        c.style.background = `hsl(${Math.random()*360}, 90%, 60%)`;
        c.style.animationDuration = (1.4 + Math.random()*1.6) + "s";
        c.style.width = (6 + Math.random()*10) + "px";
        c.style.height = (8 + Math.random()*16) + "px";
        document.body.appendChild(c);
        setTimeout(()=>c.remove(), 3600);
      }
    }

    // YES click: play song + overlay + confetti + redirect
    const yesMusic = document.getElementById("yesMusic");
    const overlay = document.getElementById("yesOverlay");
    const overlayText = document.getElementById("overlayText");

    yesBtn.addEventListener("click", async ()=>{
      overlayText.textContent = `YAYYYY!! ${GIRL_NAME} said YES 🥹💘`;
      overlay.style.display = "flex";
      confettiBurst(240);

      try{
        yesMusic.currentTime = 0;
        await yesMusic.play();
      }catch(e){}

      setTimeout(()=> window.location.href = YES_REDIRECT, 2000);
    });

    requestAnimationFrame(moveNo);
  </script>
</body>
</html>
